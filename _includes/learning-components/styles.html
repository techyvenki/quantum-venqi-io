<style>
  .interactive-box {
    border: 1px solid var(--edge);
    border-radius: 16px;
    background: rgba(14, 8, 32, 0.76);
    padding: 1rem;
    margin: 0.9rem 0 1.2rem;
  }

  .interactive-title {
    margin: 0 0 0.3rem;
    font-family: "Martian Mono", monospace;
    font-size: 0.76rem;
    letter-spacing: 0.16em;
    color: #dcd6ee;
  }

  .interactive-note {
    margin: 0 0 0.7rem;
    color: var(--dim);
    font-size: 0.8rem;
    line-height: 1.55;
  }

  .sim-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.8rem;
    align-items: center;
  }

  .sim-value {
    border: 1px solid rgba(180,165,255,0.24);
    border-radius: 10px;
    padding: 0.55rem;
    background: rgba(123,92,255,0.09);
    text-align: center;
    font-size: 0.8rem;
    color: #ece7fb;
  }

  .sim-slider {
    width: 100%;
    accent-color: var(--spin);
  }

  .sim-bars {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }

  .bar-wrap {
    border: 1px solid rgba(180,165,255,0.24);
    border-radius: 10px;
    background: rgba(8,4,22,0.8);
    padding: 0.5rem;
  }

  .bar-label {
    font-size: 0.72rem;
    color: var(--dim);
    margin-bottom: 0.35rem;
  }

  .bar {
    height: 12px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, var(--spin), var(--phase));
    transition: width 220ms ease;
  }

  .sim-canvas {
    width: 100%;
    border: 1px solid rgba(180,165,255,0.26);
    border-radius: 12px;
    background: radial-gradient(circle at 30% 20%, rgba(123,92,255,0.12), rgba(0,0,0,0));
    padding: 0.5rem;
  }

  .sim-canvas svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .sim-controls {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
    margin-top: 0.65rem;
  }

  .sim-controls button {
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: rgba(24,13,52,0.56);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.66rem;
    letter-spacing: 0.12em;
    padding: 0.4rem 0.7rem;
    cursor: pointer;
  }

  .sim-controls button:hover,
  .sim-controls button:focus-visible {
    border-color: rgba(56,232,208,0.6);
    box-shadow: 0 0 14px rgba(56,232,208,0.2);
  }

  .progress-box {
    border: 1px solid var(--edge);
    border-radius: 14px;
    background: rgba(16, 9, 36, 0.72);
    padding: 0.9rem;
    margin: 1rem 0 1.2rem;
  }

  .progress-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.65rem;
  }

  .progress-title {
    margin: 0;
    font-size: 0.75rem;
    letter-spacing: 0.16em;
    color: #ddd7ef;
  }

  .progress-stat {
    color: var(--dim);
    font-size: 0.72rem;
    letter-spacing: 0.1em;
  }

  .progress-bar-track {
    height: 9px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    margin-bottom: 0.7rem;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--spin), var(--phase));
    transition: width 200ms ease;
  }

  .progress-list {
    display: grid;
    gap: 0.42rem;
  }

  .progress-list label {
    display: flex;
    align-items: center;
    gap: 0.56rem;
    color: #e9e4f7;
    font-size: 0.88rem;
    line-height: 1.4;
  }

  .progress-list input[type="checkbox"] {
    accent-color: var(--spin);
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
  }

  .algo-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-bottom: 0.75rem;
  }

  .algo-tab {
    border: 1px solid rgba(180,165,255,0.28);
    border-radius: 999px;
    background: rgba(10,6,24,0.72);
    color: var(--dim);
    font: inherit;
    font-size: 0.66rem;
    letter-spacing: 0.14em;
    padding: 0.4rem 0.72rem;
    cursor: pointer;
  }

  .algo-tab[aria-pressed="true"] {
    color: #fff;
    border-color: rgba(56,232,208,0.52);
    box-shadow: 0 0 16px rgba(56,232,208,0.2);
    background: rgba(20,14,42,0.9);
  }

  .algo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 0.7rem;
  }

  .algo-card {
    border: 1px solid rgba(180,165,255,0.3);
    border-radius: 12px;
    background: rgba(16,10,34,0.66);
    padding: 0.75rem;
    transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
  }

  .algo-card.is-active {
    border-color: rgba(56,232,208,0.5);
    box-shadow: 0 0 22px rgba(56,232,208,0.16);
    transform: translateY(-1px);
  }

  .algo-card h4 {
    margin: 0 0 0.55rem;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    color: #efeafd;
  }

  .algo-rail {
    position: relative;
    height: 46px;
    border-radius: 8px;
    background: rgba(8,5,20,0.72);
    overflow: hidden;
    margin-bottom: 0.52rem;
  }

  .algo-wire {
    position: absolute;
    left: 8px;
    right: 8px;
    top: 13px;
    height: 1px;
    background: rgba(180,165,255,0.42);
  }

  .algo-wire.bottom {
    top: 32px;
  }

  .algo-gates {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 8px;
    display: flex;
    gap: 8px;
  }

  .algo-gate {
    flex: 1;
    min-width: 24px;
    border-radius: 7px;
    text-align: center;
    padding: 6px 0;
    color: #ece7fb;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    background: rgba(123,92,255,0.24);
  }

  .algo-card[data-algo="grover"] .algo-gate {
    background: rgba(56,232,208,0.22);
  }

  .algo-card[data-algo="qft"] .algo-gate {
    background: rgba(255,95,162,0.22);
  }

  .algo-pulse {
    position: absolute;
    top: 17px;
    left: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--spin);
    box-shadow: 0 0 14px rgba(56,232,208,0.5);
    opacity: 0;
  }

  .algo-card.is-active .algo-pulse {
    opacity: 1;
    animation: algo-slide 1.7s ease-in-out infinite;
  }

  @keyframes algo-slide {
    0% { transform: translateX(0); }
    50% { transform: translateX(74px); }
    100% { transform: translateX(148px); }
  }

  .algo-note {
    margin: 0;
    color: #cdc6e2;
    font-size: 0.82rem;
    line-height: 1.55;
  }
</style>
