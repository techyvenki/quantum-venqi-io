<section class="interactive-box reveal" data-component="vector-transform">
  <h3 class="interactive-title">VECTOR TRANSFORM ANIMATION</h3>
  <p class="interactive-note">Pick a matrix to see how a vector changes in 2D space.</p>

  <div class="sim-canvas">
    <svg viewBox="0 0 360 260" role="img" aria-label="Vector transformation diagram">
      <line x1="30" y1="130" x2="330" y2="130" stroke="rgba(180,165,255,0.35)"/>
      <line x1="180" y1="20" x2="180" y2="240" stroke="rgba(180,165,255,0.35)"/>
      <line data-role="vec-original" x1="180" y1="130" x2="252" y2="74" stroke="rgba(255,95,162,0.8)" stroke-width="2.2" stroke-linecap="round"/>
      <line data-role="vec-transformed" x1="180" y1="130" x2="252" y2="74" stroke="#38e8d0" stroke-width="3" stroke-linecap="round"/>
      <circle data-role="vec-tip" cx="252" cy="74" r="4.6" fill="#38e8d0"/>
      <text x="260" y="66" fill="#ece8f7" font-size="11">v'</text>
      <text x="259" y="86" fill="rgba(255,95,162,0.8)" font-size="11">v</text>
    </svg>
  </div>

  <div class="sim-controls">
    <button type="button" data-matrix="1,0,0,1">IDENTITY</button>
    <button type="button" data-matrix="0,-1,1,0">ROTATE 90</button>
    <button type="button" data-matrix="1,0.7,0,1">SHEAR X</button>
    <button type="button" data-matrix="1.4,0,0,0.6">SCALE</button>
  </div>
  <p class="interactive-note" data-role="matrix-readout" style="margin-top:0.55rem">A = [[1, 0], [0, 1]]</p>
</section>
